name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpulse-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: visualizer-pw-windows-x86_64
          path: target/release/visualizer-pw.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path target/release/visualizer-pw.exe, README.md -DestinationPath visualizer-pw-${{ github.ref_name }}-windows-x86_64.zip
          gh release create ${{ github.ref_name }} --generate-notes 2>$null; $global:LASTEXITCODE = 0
          gh release upload ${{ github.ref_name }} visualizer-pw-${{ github.ref_name }}-windows-x86_64.zip --clobber
