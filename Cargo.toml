[package]
name = "visualizer-pw"
version = "0.3.1"
edition = "2024"
description = "Terminal audio visualizer for PipeWire/PulseAudio and Windows"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
ratatui = "0.30.2"
rustfft = "6.4.1"

[target.'cfg(unix)'.dependencies]
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26.0"
